<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Sounds</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header>
      <h1 class="title">Animal Sounds</h1>
      <p class="subtitle">Tap an animal to hear its sound</p>
      <div class="mode-switch" role="group" aria-label="Sound mode">
        <button class="mode-btn active" data-mode="real">Real</button>
        <button class="mode-btn" data-mode="human">Human</button>
      </div>
    </header>
    <main id="animal-grid" class="grid"></main>
  </div>
  <div id="ripple-container"></div>
  <script src="app.js"></script>
</body>
</html>
